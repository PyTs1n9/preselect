[pytest]
# `hydra-core` installs a global pytest11 plugin that imports PyYAML. On this
# machine PyYAML is absent, so collection aborts before any project test runs.
# The plugin is unrelated to this repository, so it is disabled by name rather
# than by disabling plugin autoload (which would also hide real plugin bugs).
# On a clean venv the name matches nothing and the flag is a no-op.
addopts = -p no:hydra_pytest
testpaths = tests
